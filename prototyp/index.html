<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reparatur-Lernplattform Prototyp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: Werkbank-Ansicht. Links die Szenenliste für Reviews, rechts eine schmale App-Spalte wie auf dem Handy. */
:root {
  --bg: #e9ecef;
  --surface: #ffffff;
  --sunken: #f3f5f7;
  --line: #cfd5dc;
  --ink: #17202a;
  --muted: #586472;
  --primary: #1d3a5c;
  --on-primary: #ffffff;
  --signal: #f2c200;
  --on-signal: #17202a;
  --plate: #d6dbe1;
  --plate-ink: #26303b;
  --good: #1d7547;
  --good-bg: #e3f2e9;
  --warn: #9a5800;
  --warn-bg: #fbefd9;
  --crit: #b42318;
  --crit-bg: #fbe5e3;
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", Roboto, Arial, sans-serif;
  --font-mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161c; --surface: #1a2129; --sunken: #151b22; --line: #2d3742;
    --ink: #e6ebf0; --muted: #9ba7b4; --primary: #8fb5e3; --on-primary: #0d1620;
    --signal: #e8b900; --on-signal: #17202a; --plate: #2a333d; --plate-ink: #dfe5eb;
    --good: #57c590; --good-bg: #16312a; --warn: #f0a63f; --warn-bg: #352812;
    --crit: #f2786d; --crit-bg: #3a1c1a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161c; --surface: #1a2129; --sunken: #151b22; --line: #2d3742;
  --ink: #e6ebf0; --muted: #9ba7b4; --primary: #8fb5e3; --on-primary: #0d1620;
  --signal: #e8b900; --on-signal: #17202a; --plate: #2a333d; --plate-ink: #dfe5eb;
  --good: #57c590; --good-bg: #16312a; --warn: #f0a63f; --warn-bg: #352812;
  --crit: #f2786d; --crit-bg: #3a1c1a; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.55;
}
h1, h2, h3 { font-family: var(--font-display); line-height: 1.2; margin: 0; text-wrap: balance; }
h1 { font-size: 27px; font-weight: 800; letter-spacing: -0.01em; }
h2 { font-size: 19px; font-weight: 700; }
h3 { font-size: 16px; font-weight: 700; }
p { margin: 0; }
a { color: var(--primary); }
:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; border-radius: 4px; }

/* Topbar */
.topbar {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 800; font-size: 17px; }
.brand-mark { width: 26px; height: 26px; border-radius: 6px; background: var(--signal); display: grid; place-items: center; }
.proto-chip { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--warn-bg); color: var(--warn); }
.topbar .spacer { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg a, .seg button {
  font: inherit; font-size: 13px; font-weight: 600; padding: 6px 12px; border: 0; background: transparent;
  color: var(--muted); text-decoration: none; cursor: pointer;
}
.seg a[aria-current="true"], .seg button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); }
#sceneSelect { display: none; font: inherit; font-size: 14px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }

/* Shell */
.shell { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: calc(100% - 53px); }
.scenes { border-right: 1px solid var(--line); padding: 18px 14px; background: var(--sunken); }
.scenes h4 { font-family: var(--font-body); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 18px 8px 6px; }
.scenes h4:first-child { margin-top: 0; }
.scenes ol, .scenes ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.scenes a {
  display: flex; gap: 8px; align-items: baseline; padding: 6px 8px; border-radius: 7px;
  color: var(--ink); text-decoration: none; font-size: 14px;
}
.scenes a .n { font-family: var(--font-mono); font-size: 12px; color: var(--muted); min-width: 16px; }
.scenes a:hover { background: var(--surface); }
.scenes a[aria-current="page"] { background: var(--surface); box-shadow: inset 3px 0 0 var(--signal); font-weight: 600; }
.scenes .reset { margin-top: 22px; }
.scenes .note { font-size: 12px; color: var(--muted); margin: 14px 8px 0; }

main { padding: 28px 20px 64px; }
.app { max-width: 640px; margin: 0 auto; display: grid; gap: 18px; }

/* Progress */
.progress { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
.progress span { height: 5px; border-radius: 3px; background: var(--line); }
.progress span.done { background: var(--primary); }
.progress span.now { background: var(--signal); }
.progress-label { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }

/* Cards and blocks */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: grid; gap: 12px; }
.card.flat { background: var(--sunken); }
.stack { display: grid; gap: 12px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.lead { font-size: 16px; color: var(--muted); }
.eyebrow { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }

/* Buttons */
.btn {
  font: inherit; font-weight: 600; font-size: 15px; padding: 10px 16px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none;
  display: inline-flex; align-items: center; gap: 8px; justify-content: center;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.btn.signal { background: var(--signal); border-color: var(--signal); color: var(--on-signal); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--primary); padding-left: 4px; padding-right: 4px; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: space-between; align-items: center; }

/* Pills */
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--sunken); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.pill.good { background: var(--good-bg); color: var(--good); border-color: transparent; }
.pill.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.pill.crit { background: var(--crit-bg); color: var(--crit); border-color: transparent; }
.pill.ki { background: transparent; border-style: dashed; color: var(--ink); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

/* Forms */
label { font-weight: 600; font-size: 14px; display: block; margin-bottom: 4px; }
.field { display: grid; gap: 2px; }
.hint { font-size: 12.5px; color: var(--muted); }
input[type="text"], input[type="date"], textarea, select {
  width: 100%; font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px;
}
textarea { min-height: 84px; resize: vertical; }
.check { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; font-size: 15px; margin: 0; cursor: pointer; }
.check input { margin-top: 4px; width: 17px; height: 17px; accent-color: var(--primary); }

/* Ask box */
.ask { display: grid; gap: 10px; }
.ask-input { display: flex; gap: 8px; }
.ask-input input { font-size: 17px; padding: 12px 14px; }

/* Typenschild */
.plate {
  position: relative; background: var(--plate); color: var(--plate-ink); border-radius: 6px;
  padding: 14px 18px; font-family: var(--font-mono); font-size: 13px; line-height: 1.7;
  border: 1px solid var(--line);
}
.plate::before, .plate::after {
  content: ""; position: absolute; width: 7px; height: 7px; border-radius: 50%;
  background: var(--line); top: 8px;
}
.plate::before { left: 8px; } .plate::after { right: 8px; }
.plate dl { display: grid; grid-template-columns: max-content 1fr; gap: 0 14px; margin: 0; }
.plate dt { color: var(--muted); }
.plate dd { margin: 0; }

/* Photos */
.photos { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.photo { aspect-ratio: 1; border-radius: 8px; border: 1px solid var(--line); background: var(--sunken); display: grid; place-items: center; text-align: center; font-size: 11.5px; color: var(--muted); padding: 6px; }
.photo svg { width: 46%; height: auto; color: var(--muted); }
.photo.add { border-style: dashed; cursor: pointer; }
.photo.add input { position: absolute; width: 1px; height: 1px; opacity: 0; }

/* Lists of steps */
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.step { display: grid; grid-template-columns: 34px 1fr; gap: 12px; padding: 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.step .num { width: 30px; height: 30px; border-radius: 50%; background: var(--sunken); border: 1px solid var(--line); display: grid; place-items: center; font-family: var(--font-mono); font-size: 13px; }
.step .why { font-size: 13.5px; color: var(--muted); }
.step .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12.5px; color: var(--muted); }
.correction { border-left: 3px solid var(--signal); background: var(--warn-bg); color: var(--ink); padding: 8px 10px; border-radius: 0 6px 6px 0; font-size: 13.5px; }
.correction b { color: var(--warn); }

/* Checklist of research */
.trail { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.trail li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; color: var(--muted); }
.trail li .ic { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); margin-top: 2px; }
.trail li.done { color: var(--ink); }
.trail li.done .ic { border-color: var(--good); background: var(--good); box-shadow: inset 0 0 0 3px var(--surface); }
.trail li.now .ic { border-color: var(--signal); }

/* Tables */
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th, .tbl td { text-align: left; padding: 8px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
.tbl td.num { font-variant-numeric: tabular-nums; }
.scroll-x { overflow-x: auto; }

/* Option cards */
.option { display: grid; gap: 10px; align-content: start; min-width: 0; }
.option > * { min-width: 0; }
.option dl { display: grid; grid-template-columns: 1fr; gap: 0; margin: 0; font-size: 14px; }
.option dt { color: var(--muted); font-size: 12px; margin-top: 8px; }
.option dt:first-child { margin-top: 0; }
.option dd { margin: 0; font-variant-numeric: tabular-nums; overflow-wrap: break-word; }
.option .btn.ghost { justify-content: flex-start; padding-left: 0; text-align: left; }
.ask-input .btn { flex-shrink: 0; white-space: nowrap; }
.option.selected { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary); }

/* Timeline */
.timeline { list-style: none; margin: 0; padding: 0 0 0 14px; border-left: 2px solid var(--line); display: grid; gap: 14px; }
.timeline li { position: relative; padding-left: 12px; }
.timeline li::before { content: ""; position: absolute; left: -21px; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--muted); }
.timeline li.ok::before { border-color: var(--good); background: var(--good); }
.timeline li.wait::before { border-color: var(--signal); }
.timeline time { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }

/* Notice */
.notice { display: grid; grid-template-columns: 6px 1fr; gap: 12px; padding: 14px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); }
.notice .bar { border-radius: 3px; background: var(--primary); }
.notice.warn .bar { background: var(--signal); }
.notice.crit .bar { background: var(--crit); }
.notice.good .bar { background: var(--good); }

/* Segmented choice inside tables */
.choice { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.choice button { font: inherit; font-size: 12.5px; padding: 4px 9px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
.choice button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); }

/* Rating */
.scale { display: flex; gap: 6px; flex-wrap: wrap; }
.scale button { font: inherit; width: 42px; height: 42px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; font-weight: 600; }
.scale button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }

/* Certificate */
.cert { border: 2px solid var(--ink); border-radius: var(--radius); padding: 20px; background: var(--surface); display: grid; gap: 10px; position: relative; overflow: hidden; }
.cert::after { content: ""; position: absolute; right: -40px; top: -40px; width: 120px; height: 120px; background: var(--signal); transform: rotate(45deg); }
.cert h2 { font-size: 22px; position: relative; z-index: 1; }

/* Quiz */
.quiz { display: grid; gap: 8px; }
.quiz button { font: inherit; text-align: left; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.quiz button.right { border-color: var(--good); background: var(--good-bg); }
.quiz button.wrong { border-color: var(--crit); background: var(--crit-bg); }

/* Toast */
#toast {
  position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); max-width: calc(100% - 32px);
  background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 8px; font-size: 14px;
  opacity: 0; pointer-events: none; transition: opacity .2s ease; z-index: 10;
}
#toast.show { opacity: 1; }

@media (max-width: 860px) {
  .topbar { position: static; }
  .shell { grid-template-columns: 1fr; }
  .scenes { display: none; }
  #sceneSelect { display: block; }
  main { padding: 18px 16px 56px; }
}
@media (max-width: 560px) {
  .grid3, .grid2 { grid-template-columns: 1fr; }
  .photos { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ask-input { flex-direction: column; }
  .topbar { padding: 10px 16px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>

    return '<div class="stack" style="gap:6px"><span class="eyebrow">Crowd-Seite · Prüfmaske</span><h1>' + CASE_ID + ": Abpumpfehler F21</h1>" +
      '<div class="row">' + levelPill(2) + '<span class="pill">Musterwerk MW 714 E</span><span class="pill">Zuteilung: Haushaltsgroßgeräte</span></div></div>' +
      '<div class="card flat"><div class="row" style="justify-content:space-between"><b>Deine Reputation</b><span class="pill good">Fachnachweis geprüft</span></div><p class="small">Aus deinen letzten 20 freigegebenen Plänen wurden 18 erfolgreich repariert. Planfehler, die nach der Reparatur gemeldet werden, senken die Reputation.</p></div>' +
      stepList(false) +
      '<form class="card" id="reviewForm"><h3>Prüfpunkte</h3>' + list +
      '<div class="field"><label for="rcomment">Kommentar oder Korrektur</label><textarea id="rcomment">Bei Schritt 3 fehlen Handtücher, da kommt mehr Wasser als man denkt.</textarea></div>' +
      '<div class="row"><button class="btn primary" type="button" data-act="review" data-val="freigegeben">Freigeben</button><button class="btn signal" type="button" data-act="review" data-val="freigegeben mit Korrekturen">Freigeben mit Korrekturen</button><button class="btn" type="button" data-act="review" data-val="zurück an die KI">Zurück an die KI</button></div>' +
      '<p class="hint">Interessenkonflikt: Nach deiner Prüfung kannst du diesen Fall nicht als Ausführende:r übernehmen.</p></form>' + saved;
  };

  /* ---------- Render ---------- */
  function current() {
    var h = (location.hash || "").replace("#", "");
    return SCENES.some(function (s) { return s.id === h; }) ? h : "start";
  }
  function render() {
    var id = current();
    clearTimeout(timer);
    if (id === "recherche" && S.recherche < TRAIL.length) {
      if (reduced()) { S.recherche = TRAIL.length; }
      else { timer = setTimeout(function () { S.recherche++; render(); }, S.recherche === 0 ? 350 : 650); }
    }
    $("#app").innerHTML = R[id]();
    document.querySelectorAll("#scenes a").forEach(function (a) { a.setAttribute("aria-current", a.dataset.scene === id ? "page" : "false"); });
    $("#sceneSelect").value = id;
    $("#roleUser").setAttribute("aria-current", id !== "pruefer");
    $("#roleReviewer").setAttribute("aria-current", id === "pruefer");
    var s = SCENES.filter(function (x) { return x.id === id; })[0];
    document.title = s.label + " · Reparatur-Lernplattform Prototyp";
  }
  function go(id) {
    if (current() === id) { render(); } else { location.hash = id; }
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", function () { render(); window.scrollTo(0, 0); });

  /* ---------- Aktionen ---------- */
  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-go],[data-act]");
    if (!el || el.disabled) return;
    if (el.dataset.go) { go(el.dataset.go); return; }
    var a = el.dataset.act, v = el.dataset.val;
    switch (a) {
      case "reset": S = freshState(); go("start"); toast("Prototyp zurückgesetzt."); break;
      case "submitReview": S.planStatus = "pruefung"; go("pruefung"); break;
      case "simulateReview": S.reviewDone = true; S.planStatus = "freigegeben"; render(); break;
      case "contactSeller": toast("Im Prototyp nicht umgesetzt: Kontakt zum Verkäufer."); break;
      case "choose": S.option = el.dataset.opt; go(OPTIONS.filter(function (o) { return o.id === S.option; })[0].go); break;
      case "tool": S.tools[el.dataset.tool] = v; S.rentRequested = false; render(); break;
      case "rent": S.rentRequested = true; render(); toast("Leihe über die Nachbarplattform angefragt (simuliert)."); break;
      case "startSteps": S.stepIdx = 0; render(); window.scrollTo(0, 0); break;
      case "nextStep": S.stepIdx++; render(); window.scrollTo(0, 0); break;
      case "prevStep": S.stepIdx--; render(); window.scrollTo(0, 0); break;
      case "pump": S.pumpOk = v === "ja"; render(); break;
      case "help": toast("Hilfe-Anfrage mit Schritt " + (S.stepIdx + 1) + " an die Crowd gesendet (simuliert)."); break;
      case "helper": S.helper = el.dataset.id; render(); break;
      case "slot": S.slot = v; render(); break;
      case "book": S.booked = true; render(); window.scrollTo(0, 0); break;
      case "workshop": S.workshop = el.dataset.id; render(); break;
      case "sendWorkshop": S.workshopSent = true; render(); window.scrollTo(0, 0); break;
      case "rate": S.rating = Number(v); render(); break;
      case "filter": S.catalogFilter = Number(v); render(); break;
      case "openLesson": S.lesson = el.dataset.id; go("lernpfad"); break;
      case "answer": S.answers[el.dataset.key] = Number(v); render(); break;
      case "review":
        S.reviewerSaved = v;
        if (v !== "zurück an die KI") { S.reviewDone = true; S.planStatus = "freigegeben"; }
        render(); toast("Prüfung gespeichert: " + v + ".");
        break;
    }
  });

  document.addEventListener("change", function (e) {
    var t = e.target;
    if (t.dataset.safety) { S.safety[t.dataset.safety] = t.checked; render(); }
    else if (t.dataset.rcheck) { S.reviewerChecks[Number(t.dataset.rcheck)] = t.checked; }
    else if (t.id === "videoOpt") { S.video = t.checked; }
    else if (t.id === "kauf") { if (t.value) S.kaufdatum = t.value; }
    else if (t.id === "share") { S.share = t.checked; }
    else if (t.id === "freeReview") { S.freeReview = t.checked; render(); }
    else if (t.name === "res") { S.result = t.value; }
    else if (t.type === "file" && t.files && t.files.length) { toast("Foto „" + t.files[0].name + "“ hinzugefügt (bleibt im Browser)."); }
  });

  document.addEventListener("submit", function (e) {
    e.preventDefault();
    var f = e.target;
    if (f.id === "askForm") { S.question = $("#q").value || S.question; go("fall"); }
    else if (f.id === "fallForm") { S.fehler = $("#fehler").value; S.kaufdatum = $("#kauf").value || S.kaufdatum; S.recherche = 0; go("recherche"); }
    else if (f.id === "feedbackForm") { go("abschluss"); }
    else if (f.id === "freeForm") { S.freeText = $("#freeText").value; S.freeDone = true; render(); }
  });

  buildNav();
  render();
})();
</script>
</body>
</html>
